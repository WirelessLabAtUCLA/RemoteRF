[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remoterf-host"
version = "1.3.5"
description = "RemoteRF host-side control package"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ethan Ge" }]
dependencies = [
  "remoterf-device-core==0.1.3",
  "remoterf-federation-core==0.22.0",
  "aioice>=0.10,<0.11",
  "aioquic>=1.2,<2.0",
  "grpcio>=1.78.1,<2.0.0",
  "protobuf>=6.31.1,<7.0.0",
  "numpy",
  "prompt_toolkit",
  "python-dotenv",
  "grpcio-tools",
  "pyyaml",
  "pyadi-iio",
  # pylibiio 1.0 binds libiio 1.x; Ubuntu/Debian ship libiio 0.2x.
  "pylibiio>=0.25,<1",
  "pyrtlsdr>=0.5,<0.6",
  "pyrtlsdrlib>=0.0.5,<0.1",
  "pyhackrf2>=1.0.3,<2.0",
  "pyserial>=3.5,<4.0",
]

classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Libraries for the built-in drivers that are not in the base install (see remoterf-device-core).
bluetooth = ["remoterf-device-core[bluetooth]"]
gps = ["remoterf-device-core[gps]"]
krakensdr = ["remoterf-device-core[krakensdr]"]
rfbeam_kmd7 = ["remoterf-device-core[rfbeam_kmd7]"]
ti_awr6843 = ["remoterf-device-core[ti_awr6843]"]
wifi = ["remoterf-device-core[wifi]"]
drivers = ["remoterf-device-core[drivers]"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
hostrf = "remoteRF_host.hostrf_cli:main"

[tool.setuptools.package-data]
remoteRF_host = ["*.yml"]
