[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remoterf-dev-integration-fixture"
version = "0.1.3"
description = "Guarded dev-only synthetic radio and integration route fixture; never physical qualification"
requires-python = ">=3.10"

[project.scripts]
rrf-integration-dev-server = "rrf_dev_integration_fixture.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rrf_dev_integration_fixture = ["integration.json"]
